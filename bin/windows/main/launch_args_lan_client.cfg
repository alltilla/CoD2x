// Client profile for testing against a CoD2x server running on another machine.
//
// Edit the address on the connect line below to point at the server host.
//
// The server needs no special configuration for this. UDP_OpenSocket treats
// net_ip "localhost" as INADDR_ANY, so launch_args_linux.cfg (and the windows
// server profile) already bind every interface and are reachable over the LAN.
set net_port 28961
set developer 2
set developer_script 1
set logfile 2
set showPacketStrings 0
rcon login cod2x
connect 192.168.1.10:28960
