name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (mss32.dll)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same pinned toolchain the README tells developers to install by hand.
      - name: Install MinGW-w64 i686
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.1-12.0.0-msvcrt-r2/winlibs-i686-posix-dwarf-gcc-14.2.0-mingw-w64msvcrt-12.0.0-r2.zip"
          $zip = "$env:RUNNER_TEMP\mingw.zip"
          $extractDir = "$env:RUNNER_TEMP\mingw"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extractDir

          New-Item -ItemType Directory -Path tools -Force | Out-Null
          $mingwDir = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          Move-Item -Path $mingwDir.FullName -Destination tools\mingw

          "$env:GITHUB_WORKSPACE\tools\mingw\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Release so the symbols_mss32.h regeneration step in CMakeLists.txt runs.
      # The DLL rename is done here rather than via `make build_win`, whose
      # del/move/cmd block only works under cmd.exe.
      - name: Build mss32.dll
        shell: pwsh
        run: |
          mingw32-make prebuild configure_win DEBUG=0 WIN_BUILD_DIR=build/win-Release
          cmake --build build/win-Release --target mss32 --parallel
          Remove-Item -Path bin/windows/mss32.dll -Force -ErrorAction SilentlyContinue
          Move-Item -Path bin/windows/mss32.build.dll -Destination bin/windows/mss32.dll -Force

      - name: Upload mss32.dll
        uses: actions/upload-artifact@v4
        with:
          name: mss32.dll
          path: bin/windows/mss32.dll
          if-no-files-found: error

  linux:
    name: Linux (libCoD2x.so)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Built inside ubuntu 18.04 (glibc 2.27) on purpose: this matches the WSL
      # environment the README prescribes, and keeps the shipped library loadable
      # on the old distributions game servers actually run. Building on the
      # runner's own glibc would raise the requirement - see
      # tools/ci/check_glibc_floor.sh. Only the compiler runs in the container;
      # checkout/upload stay on the host so their Node runtime is unaffected.
      - name: Build libCoD2x.so
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:18.04 bash -eux -c '
            dpkg --add-architecture i386
            # bionic is still on archive.ubuntu.com under ESM; fall back to
            # old-releases for when it is eventually moved there.
            apt-get update -qq || {
              sed -i "s|//archive.ubuntu.com|//old-releases.ubuntu.com|g; \
                      s|//security.ubuntu.com|//old-releases.ubuntu.com|g" /etc/apt/sources.list
              apt-get update -qq
            }
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential make gcc-multilib g++-multilib libc6-dev:i386 \
              libssl-dev:i386 ca-certificates curl git
            # git is needed for the reproducible build stamp; the checkout is
            # bind-mounted from the host so it is owned by another uid.
            git config --global --add safe.directory /src
            # 18.04 ships cmake 3.10; the build needs a newer one.
            curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz \
              | tar xz --strip-components=1 -C /usr/local
            make prebuild
            cmake -S . -B build/linux-Release -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
            cmake --build build/linux-Release --target linux --parallel
          '
          # The container builds as root; make the outputs readable by later steps.
          sudo chown -R "$(id -u):$(id -g)" bin/linux build || true

      - name: Assert glibc floor has not regressed
        run: tools/ci/check_glibc_floor.sh bin/linux/libCoD2x.so GLIBC_2.25

      - name: Upload libCoD2x.so
        uses: actions/upload-artifact@v4
        with:
          name: libCoD2x.so
          path: bin/linux/libCoD2x.so
          if-no-files-found: error
