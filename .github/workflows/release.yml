name: Create Release

on:
  push:
    branches:
      - master
      - main

jobs:
  # Build both targets from source. This workflow used to only check that
  # zip/windows/*.zip and zip/linux/*.zip already existed in the repository and
  # then upload them, which meant a release was whatever the person cutting it
  # happened to have on their machine - unverifiable, and not reproducible by
  # anyone else.
  build:
    if: startsWith(github.event.head_commit.message, 'Version ')
    uses: ./.github/workflows/build.yml

  create-release:
    if: startsWith(github.event.head_commit.message, 'Version ')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          VERSION=$(printf '%s\n' "$COMMIT_MSG" | grep -oP '^Version\s+\K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-test\.[0-9]+)?$')

          if [ -z "$VERSION" ]; then
            echo "Commit message must be exactly: Version {version}"
            exit 1
          fi

          if [[ "$VERSION" == *-test.* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      # The binaries are built from version.h, so a mismatch would ship a release
      # whose contents disagree with its tag.
      - name: Check the commit message version matches version.h
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IN_HEADER=$(grep -oP '^#define APP_VERSION\s+"\K[^"]+' src/shared/version.h)
          echo "commit message: $VERSION"
          echo "version.h     : $IN_HEADER"
          if [ "$VERSION" != "$IN_HEADER" ]; then
            echo "::error::version.h says '$IN_HEADER' but the commit message says '$VERSION'"
            exit 1
          fi

      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Membership matches what the released archives have always contained, so
      # the existing install instructions keep working unchanged.
      - name: Assemble release archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p stage/windows stage/linux
          cp "zip/windows/CoD2x Installation and uninstallation manual.txt" stage/windows/
          cp bin/windows/mss32_original.dll                                 stage/windows/
          cp artifacts/mss32.dll/mss32.dll                                  stage/windows/

          cp "zip/linux/CoD2x Installation and uninstallation manual.txt"   stage/linux/
          cp bin/linux/cod2_lnxded                                          stage/linux/
          cp artifacts/libCoD2x.so/libCoD2x.so                              stage/linux/
          chmod +x stage/linux/libCoD2x.so stage/linux/cod2_lnxded

          mkdir -p out
          (cd stage/windows && zip -q -X -r "$GITHUB_WORKSPACE/out/CoD2x_${VERSION}_windows.zip" .)
          (cd stage/linux   && zip -q -X -r "$GITHUB_WORKSPACE/out/CoD2x_${VERSION}_linux.zip"   .)

          for z in out/*.zip; do
            echo "== $z"
            unzip -l "$z"
            sha256sum "$z"
          done

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:'- %s' --no-merges > release-notes.md
          else
            git log HEAD --pretty=format:'- %s' --no-merges > release-notes.md
          fi

          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CoD2x ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            out/CoD2x_${{ steps.version.outputs.version }}_windows.zip
            out/CoD2x_${{ steps.version.outputs.version }}_linux.zip
